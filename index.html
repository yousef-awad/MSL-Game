<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSL Sign Language Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1442 0%, #2d1b69 25%, #1e3a8a 50%, #0c4a6e 75%, #134e4a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px;
            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.4),
                0 0 1px rgba(255, 255, 255, 0.5) inset,
                0 1px 0 rgba(255, 255, 255, 0.8) inset;
            max-width: 1600px;
            width: 100%;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .right-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        h1 {
            text-align: center;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .video-container {
            position: relative;
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            box-shadow:
                0 20px 50px rgba(6, 182, 212, 0.15),
                0 0 0 1px rgba(6, 182, 212, 0.2) inset;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            aspect-ratio: 4/3;
        }

        .video-container:hover {
            transform: translateY(-4px);
            box-shadow:
                0 25px 60px rgba(6, 182, 212, 0.25),
                0 0 0 1px rgba(6, 182, 212, 0.3) inset;
        }

        #webcam {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .game-controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 32px;
            font-size: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        .start-game-btn {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
        }

        .start-game-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(6, 182, 212, 0.5);
        }

        .start-game-btn:active {
            transform: translateY(0);
        }

        .stop-btn {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
        }

        .stop-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(244, 63, 94, 0.5);
        }

        .stop-btn:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        button:disabled::before {
            display: none;
        }

        .challenge-display {
            text-align: center;
            padding: 40px 32px;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
            border-radius: 24px;
            color: white;
            box-shadow: 0 20px 50px rgba(6, 182, 212, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .challenge-label {
            font-size: 18px;
            margin-bottom: 12px;
            opacity: 0.95;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .challenge-word {
            font-size: 64px;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            animation: wordPulse 2s ease-in-out infinite;
        }

        @keyframes wordPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .timer {
            font-size: 36px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .timer.warning {
            color: #fef3c7;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        .status {
            text-align: center;
            padding: 18px 24px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.2px;
            border: 2px solid;
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.9; }
        }

        .status.waiting {
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
            color: #3730a3;
            border-color: #818cf8;
        }

        .status.playing {
            background: linear-gradient(135deg, #cffafe 0%, #a5f3fc 100%);
            color: #0e7490;
            border-color: #06b6d4;
        }

        .status.success {
            background: linear-gradient(135deg, #ccfbf1 0%, #99f6e4 100%);
            color: #0f766e;
            border-color: #14b8a6;
        }

        .status.failure {
            background: linear-gradient(135deg, #ffe4e6 0%, #fecdd3 100%);
            color: #9f1239;
            border-color: #f43f5e;
        }

        .prediction {
            text-align: center;
            padding: 32px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 20px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .prediction-main {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            letter-spacing: -1px;
            animation: gestureAppear 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes gestureAppear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .confidence {
            font-size: 18px;
            color: #475569;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .confidence-bar {
            width: 100%;
            height: 14px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1) inset;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
            position: relative;
        }

        .confidence-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .score-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 24px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 20px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .score-item {
            text-align: center;
            padding: 16px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .score-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }

        .score-label {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .score-value {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .api-status {
            text-align: center;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
            border: 2px solid;
            animation: statusBlink 3s ease-in-out infinite;
        }

        @keyframes statusBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        .api-status.connected {
            background: linear-gradient(135deg, #ccfbf1 0%, #99f6e4 100%);
            color: #0f766e;
            border-color: #14b8a6;
        }

        .api-status.disconnected {
            background: linear-gradient(135deg, #ffe4e6 0%, #fecdd3 100%);
            color: #9f1239;
            border-color: #f43f5e;
        }

        .success-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 150px;
            z-index: 1000;
            animation: celebrate 1s ease-out;
        }

        @keyframes celebrate {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3) rotate(180deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 32px;
            }

            .video-container {
                max-width: 720px;
                margin: 0 auto;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 32px;
            }

            .challenge-word {
                font-size: 48px;
            }

            .prediction-main {
                font-size: 36px;
            }

            button {
                padding: 12px 24px;
                font-size: 14px;
            }

            .score-display {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Sign Language Challenge</h1>
            <p class="subtitle">Show the sign within 15 seconds!</p>
            <div id="apiStatus" class="api-status disconnected">
                Checking API connection...
            </div>
        </div>

        <div class="main-content">
            <div class="left-section">
                <div class="video-container">
                    <video id="webcam" autoplay playsinline></video>
                </div>

                <div class="game-controls">
                    <button id="startGameBtn" class="start-game-btn">Start Game</button>
                    <button id="stopBtn" class="stop-btn" disabled>Stop Game</button>
                </div>

                <div id="status" class="status waiting">
                    Click "Start Game" to begin the challenge!
                </div>
            </div>

            <div class="right-section">
                <div class="score-display">
                    <div class="score-item">
                        <div class="score-label">Correct</div>
                        <div class="score-value" id="correctScore">0</div>
                    </div>
                    <div class="score-item">
                        <div class="score-label">Wrong</div>
                        <div class="score-value" id="wrongScore">0</div>
                    </div>
                    <div class="score-item">
                        <div class="score-label">Streak</div>
                        <div class="score-value" id="streakScore">0</div>
                    </div>
                </div>

                <div class="challenge-display" style="display: none;" id="challengeDisplay">
                    <div class="challenge-label">Sign this word:</div>
                    <div class="challenge-word" id="challengeWord">-</div>
                    <div class="timer" id="timer">
                        <span>⏱️</span>
                        <span id="timeRemaining">15</span>
                        <span>seconds</span>
                    </div>
                </div>

                <div id="prediction" class="prediction" style="display: none;">
                    <div class="prediction-main" id="gestureText">-</div>
                    <div class="confidence">
                        Confidence: <span id="confidenceText">0%</span>
                    </div>
                    <div class="confidence-bar">
                        <div class="confidence-fill" id="confidenceFill" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://zeqhx-msl-project.hf.space';
        const SESSION_ID = 'game-session-' + Date.now();
        const GAME_DURATION = 15; // seconds

        let webcamStream = null;
        let isProcessing = false;
        let processInterval = null;
        let gameTimer = null;
        let timeRemaining = GAME_DURATION;
        let availableGestures = [];
        let currentChallenge = null;
        let isGameActive = false;

        // Score tracking
        let correctCount = 0;
        let wrongCount = 0;
        let currentStreak = 0;

        // DOM elements
        const webcam = document.getElementById('webcam');
        const startGameBtn = document.getElementById('startGameBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const predictionDiv = document.getElementById('prediction');
        const gestureText = document.getElementById('gestureText');
        const confidenceText = document.getElementById('confidenceText');
        const confidenceFill = document.getElementById('confidenceFill');
        const apiStatus = document.getElementById('apiStatus');
        const challengeDisplay = document.getElementById('challengeDisplay');
        const challengeWord = document.getElementById('challengeWord');
        const timer = document.getElementById('timer');
        const timeRemainingSpan = document.getElementById('timeRemaining');
        const correctScore = document.getElementById('correctScore');
        const wrongScore = document.getElementById('wrongScore');
        const streakScore = document.getElementById('streakScore');

        // Check API connection
        async function checkAPI() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();

                apiStatus.className = 'api-status connected';
                apiStatus.textContent = `API Connected (Device: ${data.device})`;

                availableGestures = data.gestures;

                return true;
            } catch (error) {
                apiStatus.className = 'api-status disconnected';
                apiStatus.textContent = 'API Disconnected - Make sure the server is running';
                return false;
            }
        }

        // Start webcam
        async function startWebcam() {
            try {
                webcamStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 }
                });
                webcam.srcObject = webcamStream;

                return true;
            } catch (error) {
                alert('Error accessing webcam: ' + error.message);
                return false;
            }
        }

        // Stop webcam
        function stopWebcam() {
            if (webcamStream) {
                webcamStream.getTracks().forEach(track => track.stop());
                webcamStream = null;
            }

            if (processInterval) {
                clearInterval(processInterval);
                processInterval = null;
            }

            if (gameTimer) {
                clearInterval(gameTimer);
                gameTimer = null;
            }

            isProcessing = false;
            isGameActive = false;
            startGameBtn.disabled = false;
            stopBtn.disabled = true;

            challengeDisplay.style.display = 'none';
            predictionDiv.style.display = 'none';
            updateStatus('waiting', 'Game stopped. Click "Start Game" to play again!');
        }

        // Reset session on backend
        async function resetSession() {
            try {
                await fetch(`${API_URL}/reset?session_id=${SESSION_ID}`, {
                    method: 'POST'
                });
            } catch (error) {
                console.error('Reset error:', error);
            }
        }

        // Start new round
        async function startNewRound() {
            if (availableGestures.length === 0) {
                alert('No gestures available. Please check API connection.');
                return;
            }

            // Reset backend session for fresh start
            await resetSession();

            // Pick random gesture
            currentChallenge = availableGestures[Math.floor(Math.random() * availableGestures.length)];
            challengeWord.textContent = currentChallenge;
            challengeDisplay.style.display = 'block';

            // Reset timer
            timeRemaining = GAME_DURATION;
            timeRemainingSpan.textContent = timeRemaining;
            timer.classList.remove('warning');

            // Start game
            isGameActive = true;
            isProcessing = true;

            // Start processing frames immediately (no buffer)
            processInterval = setInterval(processFrame, 33); // Process 30 frames per second

            // Start countdown
            gameTimer = setInterval(updateTimer, 1000);

            updateStatus('playing', 'Show the sign! Time is ticking...');
            predictionDiv.style.display = 'block';
        }

        // Update timer
        function updateTimer() {
            timeRemaining--;
            timeRemainingSpan.textContent = timeRemaining;

            if (timeRemaining <= 5) {
                timer.classList.add('warning');
            }

            if (timeRemaining <= 0) {
                endRound(false);
            }
        }

        // Process frame
        async function processFrame() {
            if (!isProcessing) return;

            try {
                // Capture frame from webcam
                const canvas = document.createElement('canvas');
                canvas.width = webcam.videoWidth;
                canvas.height = webcam.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(webcam, 0, 0);

                // Convert to base64
                const base64Image = canvas.toDataURL('image/jpeg').split(',')[1];

                // Send to API
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        frame: base64Image,
                        session_id: SESSION_ID
                    })
                });

                const data = await response.json();
                updatePrediction(data);
            } catch (error) {
                console.error('Processing error:', error);
            }
        }

        // Update prediction display
        function updatePrediction(data) {
            if (!isGameActive) return;

            // Always show predictions
            gestureText.textContent = data.gesture.toUpperCase();
            confidenceText.textContent = (data.confidence * 100).toFixed(1) + '%';
            confidenceFill.style.width = (data.confidence * 100) + '%';

            // Check if prediction matches challenge (with high confidence)
            if (data.gesture.toLowerCase() === currentChallenge.toLowerCase() && data.confidence > 0.7) {
                endRound(true);
            }
        }

        // End round
        function endRound(success) {
            if (!isGameActive) return;

            isGameActive = false;
            clearInterval(gameTimer);
            clearInterval(processInterval);

            if (success) {
                correctCount++;
                currentStreak++;
                updateStatus('success', `Correct! You signed "${currentChallenge}" successfully!`);
                showSuccessAnimation();
            } else {
                wrongCount++;
                currentStreak = 0;
                updateStatus('failure', `Time's up! The word was "${currentChallenge}". Try again!`);
            }

            updateScoreDisplay();

            // Start next round after 3 seconds
            setTimeout(() => {
                if (isProcessing) {
                    startNewRound();
                }
            }, 3000);
        }

        // Show success animation
        function showSuccessAnimation() {
            const emoji = document.createElement('div');
            emoji.className = 'success-animation';
            emoji.textContent = '🎉';
            document.body.appendChild(emoji);
            setTimeout(() => emoji.remove(), 1000);
        }

        // Update score display
        function updateScoreDisplay() {
            correctScore.textContent = correctCount;
            wrongScore.textContent = wrongCount;
            streakScore.textContent = currentStreak;
        }

        // Update status
        function updateStatus(type, message) {
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }

        // Start game button
        startGameBtn.addEventListener('click', async () => {
            const apiConnected = await checkAPI();
            if (!apiConnected) {
                alert('Cannot start game. API is not connected.');
                return;
            }

            const webcamStarted = await startWebcam();
            if (!webcamStarted) return;

            startGameBtn.disabled = true;
            stopBtn.disabled = false;

            updateStatus('playing', 'Starting game...');

            // Wait for webcam to be ready
            setTimeout(() => {
                startNewRound();
            }, 500);
        });

        // Stop button
        stopBtn.addEventListener('click', stopWebcam);

        // Initialize
        checkAPI();
        setInterval(checkAPI, 10000); // Check API every 10 seconds
    </script>
</body>
</html>
